name: Build & Deploy Web PWA + Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  build-web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Production PWA
        run: |
          npm install --legacy-peer-deps || (
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const sec of ["dependencies", "devDependencies"]) {
                if (!pkg[sec]) continue;
                for (const k of Object.keys(pkg[sec])) {
                  pkg[sec][k] = "latest";
                }
              }
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            '
            rm -f bun.lock package-lock.json
            npm install --legacy-peer-deps
          )
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Web PWA Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Setup Java JDK 21 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Package Android APK Project
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --no-save --legacy-peer-deps
          rm -rf android
          npx cap add android
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle || true
          fi
          echo "android.suppressUnsupportedCompileSdk=34,35,36,37" >> android/gradle.properties
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Astral-Odyssey-Android-7-to-17-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  deploy-github-pages:
    needs: build-web-and-android
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
