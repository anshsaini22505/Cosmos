name: Build Android APK (Automated Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for APK (e.g. v2.2.0)'
        required: false
        default: 'v2.2.0'
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: "android-apk-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Type-Check Codebase
        run: |
          npm run lint

      - name: Compile Production Web Assets
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          npx cap add android || true
          mkdir -p android
          if [ -f android-config/variables.gradle ]; then
            cp -f android-config/variables.gradle android/variables.gradle
          fi
          npx cap sync android

      - name: Build Android Debug APK (API 24 to API 37)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p dist-apk
          # Copy APK with version and latest names
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Astral-Odyssey-Solar-Command-v2.2.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Astral-Odyssey-latest.apk
          ls -la dist-apk/

      - name: Upload APK Artifact to GitHub Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Astral-Odyssey-Android-APK
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Automatically Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        with:
          tag_name: ${{ github.event.inputs.version_tag || 'v2.2.0' }}
          name: "Astral Odyssey v2.2.0 — Android APK Release"
          body: |
            ## 🚀 Astral Odyssey: 3D Solar System & Space Command (Android APK)

            Automated APK Build generated in GitHub Actions for Android devices (compatible with Android 7.0 Nougat through Android 17 Baklava).

            ### 📲 How to Install the APK on Your Phone:
            1. Download **`Astral-Odyssey-Solar-Command-v2.2.0.apk`** below directly on your Android phone.
            2. Open the downloaded file from your browser downloads or Files app.
            3. Tap **Install** (if prompted, enable "Install unknown apps" for your browser).
            4. Launch **Astral Odyssey** and enjoy high-graphics space exploration & orbital defense offline!

            ### 🌟 Key Highlights in this Version:
            - **Ultra 4K Graphics**: Planetary atmospheric glow halos, volumetric cosmic nebulae, dynamic plasma thrusters, and pulsating solar corona.
            - **Autonomous AI Pilot**: Full self-playing mode that scans all 10 solar worlds, mines asteroids, and fights Void Pirates automatically.
            - **Multilingual Support**: 36 Indian and international languages with instant live switching.
            - **Offline PWA & Native Android**: Plays 100% offline with zero lag.
          files: |
            dist-apk/Astral-Odyssey-Solar-Command-v2.2.0.apk
            dist-apk/Astral-Odyssey-latest.apk
          draft: false
          prerelease: false
        continue-on-error: true

      - name: Generate Actions Tab Summary Report
        run: |
          echo "## 🚀 Astral Odyssey: Android APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build Package | Target OS Range | Status | Download Location |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Astral-Odyssey-Solar-Command-v2.2.0.apk** | Android 7.0 – Android 17 (API 24 to 37) | ✅ Compiled | **Actions Tab -> Artifacts -> Astral-Odyssey-Android-APK** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Astral-Odyssey-latest.apk** | Universal Android Devices | ✅ Ready | **GitHub Releases Tab / Artifacts** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Phone Installation Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll to the top of this run page and click **Artifacts**." >> $GITHUB_STEP_SUMMARY
          echo "2. Click **Astral-Odyssey-Android-APK** to download the zip containing the APK." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract and tap the **.apk** on your Android phone to install." >> $GITHUB_STEP_SUMMARY
          echo "4. Or download the direct APK file from the **GitHub Releases** page without unzipping!" >> $GITHUB_STEP_SUMMARY
